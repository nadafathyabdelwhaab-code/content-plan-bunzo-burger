<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUNZO Content Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: airy white page, only red / blue / white. Sticky pill nav (Videos / Posts), one clean card per selected item. */
:root {
  --red: #E4202C;
  --blue: #1E40D8;
  --ink: #0A1A5E;
  --paper: #FFFFFF;
  --display: "Bangers", "Cairo", Impact, sans-serif;
  --body: "Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
.wordmark, h1 .en, .card-head h2, .field h3 { letter-spacing: 1.5px; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.8;
}
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

/* Header */
.top { background: var(--paper); padding: 56px 24px 36px; }
.top-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.brand { display: flex; align-items: center; gap: 14px; direction: ltr; }
.brand img { height: auto; width: min(260px, 70vw); display: block; background: #fff; }
.wordmark { font-family: var(--display); line-height: 0.95; display: none; direction: ltr; }
.wordmark.show { display: block; }
.wordmark .b1 { display: block; font-size: 64px; color: var(--red); }
.wordmark .b2 { display: block; font-size: 30px; color: var(--blue); }
.by {
  direction: ltr; font-weight: 700; font-size: 15px; color: var(--blue);
  border: 2px solid var(--blue); border-radius: 999px; padding: 0 16px;
}
h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.3; font-weight: 900; color: var(--ink); text-wrap: balance; }
h1 .en { font-family: var(--display); color: var(--red); font-weight: 400; display: inline-block; direction: ltr; font-size: 1.2em; }

/* Section switch + nav */
.bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-top: 2px solid var(--blue); border-bottom: 2px solid var(--blue); }
.bar-inner { max-width: 880px; margin: 0 auto; padding: 14px 24px 10px; display: flex; flex-direction: column; gap: 12px; }
.switch { display: flex; gap: 10px; }
.switch button {
  font: inherit; font-weight: 700; cursor: pointer;
  padding: 0 20px; border: 2px solid var(--blue); border-radius: 999px; background: var(--paper); color: var(--blue);
}
.switch button[aria-pressed="true"] { background: var(--blue); color: var(--paper); }
.chips { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
.chip {
  flex: 0 0 auto; scroll-snap-align: start; cursor: pointer;
  font: inherit; font-weight: 700; font-size: 15px; direction: ltr;
  display: inline-flex; gap: 8px; align-items: center;
  padding: 2px 16px 2px 6px; border: 2px solid var(--blue); border-radius: 999px; background: var(--paper); color: var(--blue);
}
.chip .n {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--blue); color: var(--paper); font-size: 13px; font-weight: 900;
}
.chip:hover { border-color: var(--red); }
.chip[aria-selected="true"] { background: var(--red); border-color: var(--red); color: var(--paper); }
.chip[aria-selected="true"] .n { background: var(--paper); color: var(--red); }

/* Main */
main { max-width: 880px; margin: 0 auto; padding: 44px 24px 80px; }
.card { border: 2px solid var(--blue); border-radius: 22px; background: var(--paper); overflow: hidden; }
.card-head { padding: 28px 30px; background: var(--blue); color: var(--paper); display: flex; flex-direction: column; gap: 10px; }
.tag { align-self: flex-start; direction: ltr; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; border: 2px solid var(--paper); color: var(--paper); padding: 0 14px; border-radius: 999px; }
.card-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; direction: ltr; text-align: left; }
.fields { display: grid; }
.field { padding: 30px; border-top: 2px solid var(--blue); display: flex; flex-direction: column; gap: 14px; }
.field:first-child { border-top: 0; }
.field-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.field h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; direction: ltr; color: var(--red); }
.copy {
  font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  padding: 0 16px; border: 2px solid var(--blue); border-radius: 999px; background: var(--paper); color: var(--blue);
}
.copy:hover { border-color: var(--red); color: var(--red); }
.text { white-space: pre-wrap; margin: 0; max-width: 68ch; }
.empty { border: 2px dashed var(--blue); border-radius: 14px; padding: 14px 18px; font-weight: 600; color: var(--blue); }
.refbox { display: flex; flex-direction: column; gap: 8px; }
.reflabel { align-self: flex-start; background: var(--red); color: var(--paper); font-weight: 700; padding: 0 14px; border-radius: 999px; font-size: 14px; direction: ltr; }
.reflink { word-break: break-all; direction: ltr; text-align: left; font-weight: 700; }
.refframe { align-self: flex-end; max-width: 100%; border: 2px solid var(--blue); border-radius: 16px; overflow: hidden; background: var(--paper); line-height: 0; }
.refimg { display: block; width: auto; height: auto; max-width: 100%; max-height: 680px; }
@media (max-width: 480px) { .refimg { max-height: 520px; } }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.pager button {
  font: inherit; font-weight: 700; cursor: pointer; padding: 2px 22px;
  border: 2px solid var(--blue); border-radius: 999px; background: var(--paper); color: var(--blue);
}
.pager button:hover { background: var(--blue); color: var(--paper); }
.pager button[disabled] { opacity: 0.35; cursor: default; background: var(--paper); color: var(--blue); }

footer { background: var(--blue); color: var(--paper); padding: 22px 24px; text-align: center; font-weight: 700; }
footer span { direction: ltr; display: inline-block; }
/* English elements start from the left, Arabic from the right */
.brand, .by { align-self: flex-end; }
.switch, .chips, .field-top { direction: ltr; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media (max-width: 480px) {
  body { font-size: 16px; }
  .top { padding: 36px 20px 28px; }
  .card-head, .field { padding: 22px 20px; }
}
</style>
</head>

var chipsEl = document.getElementById("chips");
var viewEl = document.getElementById("view");
var btnV = document.getElementById("btnVideos"), btnP = document.getElementById("btnPosts");
var section = "videos";
var current = 0;

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function buildChips() {
  chipsEl.textContent = "";
  DATA[section].forEach(function (it, i) {
    var b = el("button", "chip");
    b.type = "button";
    b.id = "chip-" + it.id;
    b.setAttribute("role", "tab");
    b.appendChild(el("span", "n", String(i + 1)));
    b.appendChild(el("span", "", it.short));
    b.addEventListener("click", function () { select(section, i, true); });
    chipsEl.appendChild(b);
  });
}

function safeUrl(u) { return /^(https?:\/\/|[A-Za-z0-9_\-\/\.]+\.(png|jpe?g|webp|gif)$|data:image\/)/i.test(u); }

function field(def, value) {
  var label = def[1], kind = def[2], waiting = def[3];
  var f = el("div", "field");
  var top = el("div", "field-top");
  top.appendChild(el("h3", "", label));
  if (value && kind === "text") {
    var c = el("button", "copy", "نسخ");
    c.type = "button";
    c.addEventListener("click", function () {
      try {
        navigator.clipboard.writeText(value).then(function () { c.textContent = "اتنسخ ✓"; setTimeout(function () { c.textContent = "نسخ"; }, 1500); }, function () { c.textContent = "حدد وانسخ يدوي"; });
      } catch (e) { c.textContent = "حدد وانسخ يدوي"; }
    });
    top.appendChild(c);
  }
  f.appendChild(top);
  if (!value) {
    f.appendChild(el("div", "empty", waiting));
  } else if (kind === "link") {
    var box = el("div", "refbox");
    if (def[0] === "ref") box.appendChild(el("span", "reflabel", "Reference"));
    if (/^https?:\/\//i.test(value)) {
      var a = el("a", "reflink", value);
      a.href = value; a.target = "_blank"; a.rel = "noopener noreferrer";
      box.appendChild(a);
    } else {
      box.appendChild(el("span", "reflink", value));
    }
    f.appendChild(box);
  } else if (kind === "image") {
    if (safeUrl(value)) {
      var frame = el("div", "refframe");
      var im = el("img", "refimg");
      im.src = value; im.alt = "Reference";
      frame.appendChild(im);
      f.appendChild(frame);
    } else {
      f.appendChild(el("p", "text", value));
    }
  } else {
    f.appendChild(el("p", "text", value));
  }
  return f;
}

function render() {
  var list = DATA[section], it = list[current], vals = VALUES[it.id] || {};
  viewEl.textContent = "";
  var card = el("article", "card");
  var head = el("div", "card-head");
  var kindWord = section === "videos" ? "Video " : "Post ";
  head.appendChild(el("span", "tag", kindWord + (current + 1) + " / " + list.length + " · " + it.tag));
  head.appendChild(el("h2", "", it.title));
  card.appendChild(head);
  var fs = el("div", "fields");
  it.fields.forEach(function (def) { fs.appendChild(field(def, vals[def[0]] || "")); });
  card.appendChild(fs);
  viewEl.appendChild(card);

  var pager = el("div", "pager");
  var next = el("button", "", "التالي ←");
  var prev = el("button", "", "→ السابق");
  next.type = "button"; prev.type = "button";
  prev.disabled = current === 0;
  next.disabled = current === list.length - 1;
  prev.addEventListener("click", function () { select(section, current - 1, true); });
  next.addEventListener("click", function () { select(section, current + 1, true); });
  pager.appendChild(prev);
  pager.appendChild(next);
  viewEl.appendChild(pager);
}

function select(sec, i, scrollUp) {
  if (sec !== section) { section = sec; buildChips(); }
  var list = DATA[section];
  current = Math.max(0, Math.min(list.length - 1, i));
  btnV.setAttribute("aria-pressed", section === "videos" ? "true" : "false");
  btnP.setAttribute("aria-pressed", section === "posts" ? "true" : "false");
  list.forEach(function (it, k) {
    var b = document.getElementById("chip-" + it.id);
    b.setAttribute("aria-selected", k === current ? "true" : "false");
    if (k === current) { try { b.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
  });
  render();
  try { history.replaceState(null, "", "#" + list[current].id); } catch (e) {}
  if (scrollUp) { try { window.scrollTo({ top: 0 }); } catch (e) {} }
}

function fromHash() {
  var h = (location.hash || "").replace("#", "");
  var secs = ["videos", "posts"];
  for (var s = 0; s < secs.length; s++) {
    for (var i = 0; i < DATA[secs[s]].length; i++) if (DATA[secs[s]][i].id === h) return [secs[s], i];
  }
  return ["videos", 0];
}

btnV.addEventListener("click", function () { select("videos", 0, false); });
btnP.addEventListener("click", function () { select("posts", 0, false); });
window.addEventListener("hashchange", function () { var p = fromHash(); select(p[0], p[1], false); });

buildChips();
var start = fromHash();
if (start[0] !== section) { section = start[0]; buildChips(); }
select(start[0], start[1], false);
</script>
</body>
</html>
